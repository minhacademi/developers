title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Please write in English, so everyone who integrates with Cademí can follow the conversation.

        Share an idea for the API, webhooks, Cademí MCP, or the CLI. Once it is concrete, it may become a feature request.

        **Discussions are public.** Never paste an API key, an access token, or personal data.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: The workflow it would improve and how you imagine using it.
    validations:
      required: true
