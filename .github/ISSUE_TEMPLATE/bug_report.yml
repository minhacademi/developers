name: CLI bug report
description: Something in the cademi CLI does not work as documented.
labels: ["cli", "bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English, so everyone who integrates with Cademí can follow the conversation.

        Thanks for reporting. `cademi bug` fills in the environment fields for you. If the problem is in the API response itself, not in the CLI, use the API bug report instead.

        **This issue is public.** Never paste an API key (`ck_live_...`, `ck_test_...`), an access token, a signing secret, or personal data of your users. For security problems, see [SECURITY.md](https://github.com/minhacademi/developers/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
      placeholder: |
        I ran `cademi products list --all` and expected every product, but got only the first page.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign-in and profiles (auth)
        - API commands (products, users, …)
        - cademi api
        - cademi listen
        - cademi config
        - cademi sandbox
        - upload or download
        - update
        - Other
  - type: dropdown
    id: account-environment
    attributes:
      label: Account environment
      options:
        - production
        - sandbox
        - not sure
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and its output. Add `--debug` to include the HTTP requests (secrets are never logged). Remove anything sensitive.
      render: text
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `cademi version`.
      placeholder: cademi 0.3.1 (api 3.13.1, commit 3a8d389)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: darwin/arm64
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `cademi env`. It never includes secrets.
      render: text
  - type: input
    id: request-id
    attributes:
      label: request_id
      description: If the API returned an error, its `request_id` helps Cademí find the call.
