name: Feature request
description: Suggest something new for the Cademí API v3, webhooks, Cademí MCP, or the cademi CLI.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English, so everyone who integrates with Cademí can follow the conversation.
  - type: dropdown
    id: product
    attributes:
      label: For
      options:
        - API
        - Webhooks
        - MCP
        - CLI
        - More than one
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or workflow, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The endpoint, field, event, tool, command, or flag you have in mind. An example helps.
  - type: input
    id: version
    attributes:
      label: CLI version or API release
      placeholder: cademi 0.1.11 / API 3.8.0
