name: Documentation problem
description: Something in the documentation at cademi.dev (API, webhooks, MCP, or CLI) is wrong, unclear, or missing.
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English, so everyone who integrates with Cademí can follow the conversation.
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page.
      placeholder: https://cademi.dev/api/webhooks
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the text if it helps. If the API, a webhook, Cademí MCP, or the CLI behaves differently from the page, include what you did and what you got.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
