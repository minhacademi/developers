# o texto publico deste repositorio: o que a escrita publica confere (travessao e vazamento de coisa interna).
# Lido por `bun run cli editorial check|inspect <repo>` (core/src/editorial). Globs relativos ao repo.
# Os destinos do .cademi/imports.yaml deste repo saem sozinhos: chegam por import e nao se editam aqui.
# Repositorio publico inteiro: todo Markdown, os formularios de issue e discussion e o llms.txt.
public:
  - "**/*.md"
  - "**/*.yml"
  - llms.txt
